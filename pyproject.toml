[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coursecarry"
version = "0.6.3a0"
description = "An unofficial, local-first Brightspace assignment-submission backup utility for students."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
  "playwright==1.55.0",
  "PySide6==6.5.3",
  "requests==2.34.2",
]

[project.gui-scripts]
coursecarry = "coursecarry.app:main"

[tool.setuptools.packages.find]
include = ["coursecarry*"]

[tool.setuptools.package-data]
coursecarry = ["resources/*.png", "resources/*.ico"]
