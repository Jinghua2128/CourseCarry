[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "politeload"
version = "0.5.0a0"
description = "A personal POLITEMall / Brightspace backup utility for students."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "playwright==1.55.0",
  "PySide6==6.11.2",
  "requests==2.34.2",
]

[project.gui-scripts]
politeload = "politeload.app:main"

[tool.setuptools.packages.find]
include = ["politeload*"]

[tool.setuptools.package-data]
politeload = ["resources/*.png", "resources/*.ico"]
